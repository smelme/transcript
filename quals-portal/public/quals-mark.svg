<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quals">
  <!--
    The Quals mark: a white Q with a gold tail, from the app's own quals_logo asset. The same file is
    served by the public site; keeping a copy here means the portal and the site cannot drift apart
    without somebody noticing both.
  -->
  <circle cx="31" cy="28" r="17" fill="none" stroke="#ffffff" stroke-width="8.5" />
  <rect
    x="33"
    y="38"
    width="26"
    height="9"
    rx="4.5"
    transform="rotate(45 46 42.5)"
    fill="#ffc400"
  />
</svg>
