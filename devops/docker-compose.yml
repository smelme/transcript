version: '3.9'

services:
  issuer-service:
    build:
      context: ../issuer-service
      dockerfile: Dockerfile
    container_name: issuer-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: issuer-service
      ISSUER_ID: issuer-001
      SERVICE_VERSION: 1.0.0
    depends_on:
      - issuer-db
    networks:
      - credential-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  verifier-service:
    build:
      context: ../verifier-service
      dockerfile: Dockerfile
    container_name: verifier-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: verifier-service
      SERVICE_VERSION: 1.0.0
    depends_on:
      - verifier-db
    networks:
      - credential-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  verifier-frontend:
    build:
      context: ../verifier-frontend
      dockerfile: Dockerfile
    container_name: verifier-frontend
    ports:
      - "5173:5173"
    environment:
      REACT_APP_VERIFIER_API: http://verifier-service:3001
      NODE_ENV: production
    depends_on:
      - verifier-service
    networks:
      - credential-network

  issuer-db:
    image: postgres:15-alpine
    container_name: issuer-db
    environment:
      POSTGRES_DB: issuer_db
      POSTGRES_USER: issuer_user
      POSTGRES_PASSWORD: issuer_password_secure
    ports:
      - "5432:5432"
    volumes:
      - issuer_db_data:/var/lib/postgresql/data
    networks:
      - credential-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuer_user -d issuer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  verifier-db:
    image: postgres:15-alpine
    container_name: verifier-db
    environment:
      POSTGRES_DB: verifier_db
      POSTGRES_USER: verifier_user
      POSTGRES_PASSWORD: verifier_password_secure
    ports:
      - "5433:5432"
    volumes:
      - verifier_db_data:/var/lib/postgresql/data
    networks:
      - credential-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier_user -d verifier_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - issuer-service
      - verifier-service
      - verifier-frontend
    networks:
      - credential-network

networks:
  credential-network:
    driver: bridge

volumes:
  issuer_db_data:
  verifier_db_data:
