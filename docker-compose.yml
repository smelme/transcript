version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: transcript_postgres
    environment:
      POSTGRES_USER: transcript_user
      POSTGRES_PASSWORD: transcript_password
      POSTGRES_DB: transcript_dev
      POSTGRES_INITDB_ARGS: "-c timezone=UTC"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcript_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcript_network

  keycloak:
    image: keycloak/keycloak:latest
    container_name: transcript_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: transcript_user
      KC_DB_PASSWORD: transcript_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - transcript_network
    command: start-dev

  redis:
    image: redis:7-alpine
    container_name: transcript_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcript_network
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  transcript_network:
    driver: bridge
