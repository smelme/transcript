<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart College — Credential Issuer</title>
  <style>
    :root {
      --brand: #1a3c6e;
      --brand-light: #2c5aa0;
      --ok: #1e7e34;
      --err: #b02a37;
      --border: #d5dbe3;
      --bg: #f4f6f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #1c2530;
    }
    header {
      background: var(--brand);
      color: #fff;
      padding: 16px 24px;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(16,24,40,.05);
    }
    .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 500; color: #344054; }
    input, select, textarea {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    textarea { min-height: 72px; resize: vertical; }
    button {
      background: var(--brand-light);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--brand); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .muted { color: #667085; font-size: 13px; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge.ok { background: #e6f4ea; color: var(--ok); }
    .badge.err { background: #fdecea; color: var(--err); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .result-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }
    .kv { margin: 4px 0; font-size: 13px; }
    .kv b { color: #344054; }
    hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Smart College — Credential Issuer</h1>
    <p>Issue an ISO 23220 Photo ID mDOC (ISO 18013-5 IssuerSigned)</p>
  </header>

  <main>
    <div class="card">
      <h2>Photo ID Details</h2>
      <div class="grid">
        <div class="field full">
          <label for="full_name">Full name</label>
          <input id="full_name" value="Erika Mustermann" />
        </div>
        <div class="field">
          <label for="date_of_birth">Date of birth</label>
          <input id="date_of_birth" type="date" value="1964-08-12" />
        </div>
        <div class="field">
          <label for="document_number">Document number</label>
          <input id="document_number" value="Z021AB37X13" />
        </div>
        <div class="field">
          <label for="issuing_authority">Issuing authority</label>
          <input id="issuing_authority" value="Smart College" />
        </div>
        <div class="field">
          <label for="issuing_country">Issuing country</label>
          <input id="issuing_country" value="NL" maxlength="2" />
        </div>
        <div class="field">
          <label for="issue_date">Issue date</label>
          <input id="issue_date" type="date" value="2025-03-24" />
        </div>
        <div class="field">
          <label for="expiry_date">Expiry date</label>
          <input id="expiry_date" type="date" value="2031-03-24" />
        </div>
        <div class="field full">
          <label for="portrait">Portrait (PNG/JPEG file → base64)</label>
          <input id="portrait" type="file" accept="image/png,image/jpeg" />
        </div>
      </div>

      <hr />

      <h2>Education Qualification</h2>
      <div class="grid">
        <div class="field"><label for="institution_name">Institution</label><input id="institution_name" value="MIT" /></div>
        <div class="field">
          <label for="degree_level">Degree level</label>
          <select id="degree_level">
            <option value="associate">associate</option>
            <option value="bachelor" selected>bachelor</option>
            <option value="master">master</option>
            <option value="doctorate">doctorate</option>
          </select>
        </div>
        <div class="field"><label for="field_of_study">Field of study</label><input id="field_of_study" value="Computer Science" /></div>
        <div class="field"><label for="graduation_date">Graduation date</label><input id="graduation_date" type="date" value="2026-05-15" /></div>
        <div class="field"><label for="gpa">GPA</label><input id="gpa" type="number" step="0.1" min="0" max="4" value="3.9" /></div>
      </div>

      <hr />

      <h2>Education Transcript</h2>
      <div class="grid">
        <div class="field"><label for="student_id">Student ID</label><input id="student_id" value="STU-2026-001" /></div>
        <div class="field"><label for="total_credits">Total credits</label><input id="total_credits" type="number" value="7" /></div>
        <div class="field"><label for="status">Status</label><input id="status" value="completed" /></div>
        <div class="field full">
          <label for="courses">Courses (JSON array)</label>
          <textarea id="courses">[
  {"courseCode":"6.S191","courseName":"Machine Learning","credits":3,"grade":"A"},
  {"courseCode":"6.009","courseName":"Programming","credits":4,"grade":"A"}
]</textarea>
        </div>
      </div>

      <hr />

      <button id="issueBtn" onclick="issueCredential()">Issue Photo ID Credential</button>
      <span id="status" class="muted"></span>
    </div>

    <div class="card hidden" id="resultCard">
      <h2>Issued Credential</h2>
      <div id="result"></div>
    </div>
  </main>

  <script>
    async function issueCredential() {
      const btn = document.getElementById('issueBtn');
      const status = document.getElementById('status');
      const resultCard = document.getElementById('resultCard');
      const result = document.getElementById('result');
      btn.disabled = true;
      status.textContent = 'Issuing…';
      resultCard.classList.add('hidden');

      let portrait = null;
      const portraitFile = document.getElementById('portrait').files[0];
      if (portraitFile) {
        portrait = await new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result.split(',')[1]);
          r.onerror = () => resolve(null);
          r.readAsDataURL(portraitFile);
        });
      }

      let courses;
      try {
        courses = JSON.parse(document.getElementById('courses').value);
      } catch (e) {
        status.textContent = 'Invalid courses JSON';
        btn.disabled = false;
        return;
      }

      const payload = {
        docType: 'org.iso.23220.photoid.1',
        full_name: document.getElementById('full_name').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        document_number: document.getElementById('document_number').value,
        issuing_authority: document.getElementById('issuing_authority').value,
        issue_date: document.getElementById('issue_date').value,
        expiry_date: document.getElementById('expiry_date').value,
        issuing_country: document.getElementById('issuing_country').value,
        portrait,
        education_qualification: {
          institution_name: document.getElementById('institution_name').value,
          degree_level: document.getElementById('degree_level').value,
          field_of_study: document.getElementById('field_of_study').value,
          graduation_date: document.getElementById('graduation_date').value,
          gpa: parseFloat(document.getElementById('gpa').value) || undefined
        },
        education_transcript: {
          student_id: document.getElementById('student_id').value,
          courses,
          total_credits: parseInt(document.getElementById('total_credits').value) || undefined,
          status: document.getElementById('status').value
        }
      };

      try {
        const res = await fetch('/credentials/issue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.success) {
          status.textContent = '';
          renderError(result, data);
          resultCard.classList.remove('hidden');
          return;
        }

        status.textContent = 'Issued ✓';
        await renderResult(result, data);
        resultCard.classList.remove('hidden');
      } catch (e) {
        status.textContent = '';
        renderError(result, { error: e.message });
        resultCard.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    function renderError(container, data) {
      container.innerHTML = `<span class="badge err">Issuance failed</span>
        <div class="result-box mono">${escapeHtml(data.error || 'Unknown error')}</div>`;
    }

    async function renderResult(container, data) {
      let verificationHtml = '';
      try {
        const vres = await fetch(`/credentials/${data.credentialId}/mdoc`);
        const v = await vres.json();
        if (v.success) {
          const sig = v.verification.signatureValid ? '<span class="badge ok">✓ signature valid</span>' : '<span class="badge err">✗ signature invalid</span>';
          const dig = v.verification.digestsValid ? '<span class="badge ok">✓ digests valid</span>' : '<span class="badge err">✗ digests invalid</span>';
          verificationHtml = `<div class="kv"><b>Verification:</b> ${sig} ${dig}</div>
            <div class="kv"><b>Issuer cert:</b> ${escapeHtml((v.verification.issuerCert?.subject || '').replace(/\\n/g, ' · '))}</div>`;
        }
      } catch (e) { /* ignore */ }

      const mdoc = data.mdocBase64url || '';
      container.innerHTML = `
        <div class="kv"><b>Credential ID:</b> <span class="mono">${escapeHtml(data.credentialId)}</span></div>
        <div class="kv"><b>Status:</b> <span class="badge ok">${escapeHtml(data.status)}</span></div>
        <div class="kv"><b>docType:</b> <span class="mono">${escapeHtml(data.docType)}</span></div>
        ${verificationHtml}
        ${mdoc ? `<div class="kv"><b>mDOC (base64url):</b></div>
        <div class="result-box mono">${escapeHtml(mdoc)}</div>
        <div class="row" style="margin-top:8px">
          <button onclick="copyMdoc(this)">Copy base64url</button>
          <a href="https://paradym.id/tools/mdoc" target="_blank" rel="noopener" style="font-size:14px">Open Paradym debugger ↗</a>
        </div>` : ''}`;
    }

    function copyMdoc(btn) {
      const el = document.querySelector('#result .result-box.mono');
      navigator.clipboard.writeText(el.textContent).then(() => {
        const t = btn.textContent;
        btn.textContent = 'Copied ✓';
        setTimeout(() => (btn.textContent = t), 1500);
      });
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
