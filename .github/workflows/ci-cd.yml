name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install Issuer Service dependencies
        run: cd issuer-service && npm ci
      
      - name: Run Issuer Service tests
        run: cd issuer-service && npm test
      
      - name: Install Verifier Service dependencies
        run: cd verifier-service && npm ci
      
      - name: Run Verifier Service tests
        run: cd verifier-service && npm test
      
      - name: Install Verifier Frontend dependencies
        run: cd verifier-frontend && npm ci --legacy-peer-deps
      
      - name: Run Verifier Frontend tests
        run: cd verifier-frontend && npm test
      
      - name: Install Mobile Wallet dependencies
        run: cd mobile-wallet-native && npm ci
      
      - name: Run Mobile Wallet tests
        run: cd mobile-wallet-native && npm test
      
      - name: Install E2E Integration test dependencies
        run: cd e2e-integration-tests && npm ci
      
      - name: Run E2E Integration tests
        run: cd e2e-integration-tests && npm test
      
      - name: Run DevOps tests
        run: cd devops && npm ci && npm test

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Issuer Service image
        uses: docker/build-push-action@v4
        with:
          context: ./issuer-service
          file: ./devops/Dockerfile.issuer
          push: false
          tags: credential-issuer:latest
      
      - name: Build Verifier Service image
        uses: docker/build-push-action@v4
        with:
          context: ./verifier-service
          file: ./devops/Dockerfile.verifier
          push: false
          tags: credential-verifier:latest
      
      - name: Build Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./verifier-frontend
          file: ./devops/Dockerfile.frontend
          push: false
          tags: credential-frontend:latest

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run npm audit
        run: |
          cd issuer-service && npm audit --audit-level=moderate || true
          cd ../verifier-service && npm audit --audit-level=moderate || true
          cd ../verifier-frontend && npm audit --audit-level=moderate || true
          cd ../mobile-wallet-native && npm audit --audit-level=moderate || true
          cd ../e2e-integration-tests && npm audit --audit-level=moderate || true
          cd ../devops && npm audit --audit-level=moderate || true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy with Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploying to production..."
          # Add deployment logic here
          # This would typically use SSH to deploy to your server
          echo "Deployment completed successfully"
