name: CI

# One pipeline, and it reflects the repository as it is: an npm workspaces monorepo, installed once
# from a committed lockfile.
#
# The previous pair of workflows (ci.yml and ci-cd.yml) disagreed with each other and with the
# repository: one was not valid YAML (a duplicated `run:` key and a mis-indented line in a block
# scalar), both installed each workspace separately with `npm ci` while every lockfile was
# gitignored, and both named directories that do not exist (`mobile-wallet-native`). Nothing here
# ran successfully. See docs/stories/P1-02-ci-cannot-install-lockfile-ignored.md.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit tests and production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # One install for every workspace, from the committed root lockfile.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      # The academy, the portal, My Jobs and Trust University must be buildable, not only runnable
      # in development. Two copies of React made this fail once (see P1-01).
      - name: Production builds
        run: npm run build --workspaces --if-present

  scenarios:
    name: End-to-end scenarios
    runs-on: ubuntu-latest
    needs: verify
    env:
      BREVO_API_KEY: ''
      ALLOW_DEV_OTP: 'true'
      ADMIN_EMAIL: admin@quals.local
      ADMIN_PASSWORD: quals-admin-2026
      DATABASE_PATH: ${{ github.workspace }}/data/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install
        run: npm ci

      # The scenario scripts exercise the credential lifecycle end to end (issuance, sharing,
      # verification, tokens), which unit tests cannot. They need live services, so CI starts them
      # against a throwaway database.
      - name: Start services
        run: |
          set -e
          mkdir -p data
          node verifier-service/src/index.js > /tmp/verifier.log 2>&1 &
          (cd issuer-service && PORT=3000 node src/index.js > /tmp/issuer-3000.log 2>&1 &)
          (cd issuer-service && PORT=3005 node src/index.js > /tmp/issuer-3005.log 2>&1 &)
          (cd issuer-service && PORT=3006 NODE_ENV=production ALLOW_DEV_OTP=false \
            node src/index.js > /tmp/issuer-3006.log 2>&1 &)

          for attempt in $(seq 1 40); do
            healthy=0
            for port in 3000 3001 3005 3006; do
              curl -sf "http://127.0.0.1:$port/health" > /dev/null && healthy=$((healthy + 1))
            done
            [ "$healthy" -eq 4 ] && break
            sleep 1
          done

          for port in 3000 3001 3005 3006; do
            curl -sf "http://127.0.0.1:$port/health" > /dev/null \
              || { echo "::error::service on port $port did not become healthy"; exit 1; }
          done
          echo "All services healthy."

      - name: Run scenarios
        run: |
          set -e
          node verifier-service/scripts/test-reader-auth.mjs
          node issuer-service/scripts/test-client-orgs.mjs
          node issuer-service/scripts/test-academy-flow.mjs
          node issuer-service/scripts/test-db-auth.mjs
          node issuer-service/scripts/test-admin-auth.mjs
          node issuer-service/scripts/test-security-hardening.mjs
          node issuer-service/scripts/test-revoked-share.mjs
          node issuer-service/scripts/smoke-share.mjs
          node issuer-service/scripts/smoke-share-transcript.mjs

      - name: Service logs
        if: always()
        run: |
          for file in /tmp/issuer-3000.log /tmp/issuer-3005.log /tmp/issuer-3006.log /tmp/verifier.log; do
            echo "──── $file ────"
            tail -n 60 "$file" 2>/dev/null || echo "(no log)"
          done

  tooling:
    name: Deployment and integration test projects
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # These two are standalone npm projects rather than workspaces, and each has its own
      # committed lockfile.
      - name: DevOps checks
        run: cd devops && npm ci && npm test

      - name: Integration tests
        run: cd e2e-integration-tests && npm ci && npm test
