name: CI - Test & Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test --workspaces --if-present

      - name: Run lint
        run: npm run lint --workspaces --if-present

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: success()

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build --workspaces

  # The scenario scripts are what actually exercise the credential lifecycle
  # (issuance, sharing, verification, tokens). They need live services, so CI
  # starts them against a throwaway database and runs every scenario.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      BREVO_API_KEY: ''
      ALLOW_DEV_OTP: 'true'
      ADMIN_EMAIL: admin@quals.local
      ADMIN_PASSWORD: quals-admin-2026
      DATABASE_PATH: ${{ github.workspace }}/data/ci.db
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start services
        run: |
          set -e
          mkdir -p data
          node verifier-service/src/index.js > /tmp/verifier.log 2>&1 &
          (cd issuer-service && PORT=3000 node src/index.js > /tmp/issuer-3000.log 2>&1 &)
          (cd issuer-service && PORT=3005 node src/index.js > /tmp/issuer-3005.log 2>&1 &)
          (cd issuer-service && PORT=3006 NODE_ENV=production ALLOW_DEV_OTP=false \
            node src/index.js > /tmp/issuer-3006.log 2>&1 &)

          for attempt in $(seq 1 40); do
            healthy=0
            for port in 3000 3001 3005 3006; do
              curl -sf "http://127.0.0.1:$port/health" > /dev/null && healthy=$((healthy + 1))
            done
            [ "$healthy" -eq 4 ] && break
            sleep 1
          done

          for port in 3000 3001 3005 3006; do
            curl -sf "http://127.0.0.1:$port/health" > /dev/null \
              || { echo "::error::service on port $port did not become healthy"; exit 1; }
          done
          echo "All services healthy."

      - name: End-to-end scenarios
        run: |
          node verifier-service/scripts/test-reader-auth.mjs
          node issuer-service/scripts/test-client-orgs.mjs
          node issuer-service/scripts/test-academy-flow.mjs
          node issuer-service/scripts/test-db-auth.mjs
          node issuer-service/scripts/test-admin-auth.mjs
          node issuer-service/scripts/test-security-hardening.mjs
          node issuer-service/scripts/test-revoked-share.mjs
          node issuer-service/scripts/smoke-share.mjs
        node issuer-service/scripts/smoke-share-transcript.mjs

      - name: Service logs
        if: always()
        run: |
          for file in /tmp/issuer-3000.log /tmp/issuer-3005.log /tmp/issuer-3006.log /tmp/verifier.log; do
            echo "──── $file ────"
            tail -n 60 "$file" 2>/dev/null || echo "(no log)"
          done
