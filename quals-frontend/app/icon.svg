<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quals">
  <!--
    The browser tab icon: the app's launcher icon, which is this Q on a black field - the app's own
    window background colour. A tab is small and sits among other tabs, so the mark gets the field
    there exactly as the app gives it one.
  -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <circle cx="31" cy="28" r="17" fill="none" stroke="#ffffff" stroke-width="8.5" />
    <rect
      x="33"
      y="38"
      width="26"
      height="9"
      rx="4.5"
      transform="rotate(45 46 42.5)"
      fill="#ffc400"
    />
  </g>
</svg>
