<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quals">
  <!--
    The Quals mark: a white Q with a gold tail, drawn from the app's own quals_logo asset, which its
    own code describes as "the Quals brand mark (white Q)".

    It is not the green shield that stood here before, because the app has no green shield: it has this
    Q, on a black field, and the app's screens put it there with the window background as pure black.
    So the mark is only the Q - the field is the surface it is placed on, exactly as the app treats it.
  -->
  <circle cx="31" cy="28" r="17" fill="none" stroke="#ffffff" stroke-width="8.5" />
  <rect
    x="33"
    y="38"
    width="26"
    height="9"
    rx="4.5"
    transform="rotate(45 46 42.5)"
    fill="#ffc400"
  />
</svg>
